[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hw4"
version = "0.1.0"
description = "UCU AI 2026 HW4: Ukrainian grade-5 math with Gemma-3-4B / MamayLM-4B"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hw4 = ["configs/*.csv", "configs/*.yaml"]
